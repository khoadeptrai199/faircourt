spring.application.name=gateway

# No database. Route table and CSRF bootstrap: API foundation. Account session and identity token come with Account login (AD-14).

# Only the health endpoint is exposed (blueprint section 0).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Every log line carries the request ID (API foundation; AD-04).
logging.pattern.level=%5p [%X{requestId:-}]

# The gateway always creates the request ID and replaces any client-sent X-Request-Id (API foundation AC-10).
faircourt.request-id.trust-incoming=false

# A service that does not answer in time -> 503 SERVICE_UNAVAILABLE (owner decision 2026-11-17: 2 s / 5 s).
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# Gateway HTTP session (holds the CSRF token; later the account login): HttpOnly, SameSite=Lax,
# Secure from COOKIE_SECURE (blueprint section 0: false on local plain HTTP, true on HTTPS).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
