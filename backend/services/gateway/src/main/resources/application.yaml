spring:
  application:
    name: gateway

  # No database. Route table, CSRF bootstrap and account login live here (AD-14); the identity token for services
  # comes with the first feature whose service route needs the caller (Account login design D-4).

  http:
    clients:
      # A service that does not answer in time -> 503 SERVICE_UNAVAILABLE (owner decision 2026-11-17: 2 s / 5 s).
      connect-timeout: 2s
      read-timeout: 5s

server:
  servlet:
    session:
      # Idle timeout of the gateway HTTP session (OWASP Session Management: 15-30 minutes for a low-risk application);
      # a login also ends after faircourt.account.absolute-timeout. Both are enforced on the server.
      timeout: 30m
      # Gateway HTTP session (holds the CSRF token and the signed-in account): HttpOnly, SameSite=Lax,
      # Secure from COOKIE_SECURE (blueprint section 0: false on local plain HTTP, true on HTTPS).
      cookie:
        # Generic name, not the framework default JSESSIONID (OWASP). On HTTPS set SESSION_COOKIE_NAME=__Host-fc_sid
        # (the __Host- prefix needs Secure, so it cannot be used on plain local HTTP).
        name: "${SESSION_COOKIE_NAME:fc_sid}"
        http-only: true
        same-site: lax
        secure: "${COOKIE_SECURE:false}"

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is exposed (blueprint section 0).
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # Every log line carries the request ID (API foundation; AD-04).
    level: "%5p [%X{requestId:-}]"

faircourt:
  services:
    # Where the gateway forwards each service's routes. Default = the Compose service name (services publish no host
    # port, so the gateway reaches them only inside the Compose network).
    playmatch-url: http://playmatch-service:8080
    auth-url: http://auth-service:8080
  account:
    # A login ends after this time however active the person is (OWASP Session Management: 4-8 hours for a workday app).
    absolute-timeout: 8h
    # How often a signed-in session is checked against auth-service (a password reset ends the account's sessions).
    session-recheck-interval: 1m
  request-id:
    # The gateway always creates the request ID and replaces any client-sent X-Request-Id (API foundation AC-10).
    trust-incoming: false
