spring.application.name=playmatch-service

# Datasource comes from environment variables (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD), see compose.yaml.

# One schema per service, one shared DB user (AD-12). This service owns only the "playmatch" schema:
# Flyway creates it and keeps its history table there; every connection uses it as its search path.
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=playmatch
spring.flyway.default-schema=playmatch
spring.datasource.hikari.schema=playmatch
spring.jpa.properties.hibernate.default_schema=playmatch

# Schema is owned by Flyway; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Store and read timestamptz as UTC (blueprint section 12).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Only the health endpoint is exposed (blueprint section 0).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
