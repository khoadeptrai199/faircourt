spring:
  application:
    name: playmatch-service

  # Database connection. url and username default to a Postgres reachable from the host (docker compose publishes
  # it on 127.0.0.1:9093), so a service started outside Docker (e.g. from IntelliJ) connects with no extra setup.
  # compose.yaml overrides the url (postgres:5432) inside Docker. The password is never written here: it must come
  # from the environment variable SPRING_DATASOURCE_PASSWORD (.env), otherwise startup fails.
  datasource:
    url: jdbc:postgresql://localhost:9093/faircourt
    username: faircourt
    password: "${SPRING_DATASOURCE_PASSWORD}"
    hikari:
      schema: playmatch

  # One schema per service, one shared DB user (AD-12). This service owns only the "playmatch" schema:
  # Flyway creates it and keeps its history table there; every connection uses it as its search path.
  flyway:
    locations: classpath:db/migration
    schemas: playmatch
    default-schema: playmatch
  jpa:
    properties:
      hibernate:
        default_schema: playmatch
        # Store and read timestamptz as UTC (blueprint section 12).
        jdbc:
          time_zone: UTC
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates.
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is exposed (blueprint section 0).
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # Every log line carries the request ID (API foundation; AD-04).
    level: "%5p [%X{requestId:-}]"

faircourt:
  internal-token:
    # Checks the identity token from the gateway (AD-14). From the environment only; at least 32 bytes, else startup fails.
    secret: "${INTERNAL_TOKEN_SECRET}"
  request-id:
    # Keep the request ID the gateway forwarded (services are reachable only from the gateway).
    trust-incoming: true
  services:
    # Where playmatch-service calls the services it orchestrates (Guest check-in). Default = the Compose service name.
    player-url: "${PLAYER_URL:http://player-service:8080}"
    auth-url: "${AUTH_URL:http://auth-service:8080}"
    # A service that does not answer in time -> 503 SERVICE_UNAVAILABLE (owner decision 2026-11-17: 2 s / 5 s).
    connect-timeout: 2s
    read-timeout: 5s
  guest:
    # A guest credential ends this long after the game ends (design D-1: max(endsAt, now) + 12 h).
    cookie-grace: 12h
