spring.application.name=faircourt-backend

# Datasource comes from environment variables (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD), see compose.yaml.

# Schema is owned by Flyway; Hibernate only validates.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Store and read timestamptz as UTC (blueprint section 12).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Only the health endpoint is exposed (blueprint section 0).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
