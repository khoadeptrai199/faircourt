# FairCourt local stack. Works unchanged on macOS (arm64) and Windows WSL (no `platform:` pinned).
#   cp .env.example .env          # once
#   docker compose up --build -d  # start  -> http://localhost:5173
#   docker compose down           # stop (keeps the database volume)
name: faircourt

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE}
      DEMO_HOST_EMAIL: ${DEMO_HOST_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl/wget; bash /dev/tcp checks the health endpoint for "UP".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Inside the container, "localhost" is the frontend itself; reach the backend by service name.
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      # Source is bind-mounted for hot reload; node_modules stays inside the container
      # (Linux native packages differ from macOS ones).
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Backend tests against the separate faircourt_test database:
  #   docker compose --profile test run --rm --build backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/faircourt_test
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - m2cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy

  # Format backend Java in place (Spotless + Palantir Java Format):
  #   docker compose run --rm backend-format
  backend-format:
    profiles: ["tools"]
    build:
      context: ./backend
      target: deps
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - m2cache:/root/.m2
    command: ["mvn", "-B", "-q", "spotless:apply"]

volumes:
  pgdata:
  m2cache:
