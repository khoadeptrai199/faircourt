# FairCourt local stack. Works unchanged on macOS (arm64) and Windows WSL (no `platform:` pinned).
#   cp .env.example .env          # once
#   docker compose up --build -d  # start  -> http://localhost:9091
#   docker compose down           # stop (keeps the database volume)
# Backend = gateway + auth-service + player-service + playmatch-service (F18, OD-17). Only the gateway publishes
# a host port; each service can be started, rebuilt and followed on its own (commands: planning/sprint01-public-read/service-split/design.md section 6).
name: faircourt

# Shared settings of the three database services (one database, one schema per service, one DB user: AD-12).
# Each service's application.yaml holds the connection defaults (localhost:9093, user faircourt) so it also runs
# outside Docker. Inside Docker we only override the address and hand over the password from .env (owner decision 2026-11-18).
x-db-service: &db-service
  environment: &db-env
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck: &backend-health
    # The JRE image has no curl/wget; bash /dev/tcp checks the health endpoint for "UP".
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-9093}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The only backend component the browser reaches (through the Vite proxy). Routes: gateway route table (deny by default).
  # It does not wait for the services: a missing service will answer 503 through the gateway (AD-15).
  gateway:
    build:
      context: ./backend
      target: runtime
      args:
        MODULE: gateway
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE}
      # Guest check-in: name of the guest cookie (on HTTPS use __Host-fc_guest).
      GUEST_COOKIE_NAME: ${GUEST_COOKIE_NAME:-fc_guest}
      # Signs the identity token sent to services (Host board); same value as playmatch-service. At least 32 characters.
      INTERNAL_TOKEN_SECRET: ${INTERNAL_TOKEN_SECRET:?Set INTERNAL_TOKEN_SECRET in .env (at least 32 characters, see .env.example)}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9090}:8080"
    healthcheck: *backend-health
    restart: unless-stopped

  auth-service:
    <<: *db-service
    build:
      context: ./backend
      target: runtime
      args:
        MODULE: auth-service
    environment:
      <<: *db-env
      DEMO_HOST_EMAIL: ${DEMO_HOST_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      # Mail for the password reset codes (Password reset). Defaults = the local mail catcher below; for a real SMTP
      # server set these in .env (see .env.example). The password only ever comes from the environment.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@faircourt.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # LOCAL DEVELOPMENT ONLY: this container has no password and shows every mail (including reset codes) to anyone who can
  # open the page. Never deploy it; a real deployment sets MAIL_HOST to a real SMTP server with MAIL_STARTTLS=true.
  # Local mail catcher (Password reset): auth-service sends its mails here and nothing leaves the machine. The web page
  # shows them at http://localhost:9094. SMTP (1025) is reachable only inside Compose. Image checked for linux/amd64 and
  # linux/arm64 on 2026-11-18 (docker buildx imagetools inspect axllent/mailpit:v1.33.1).
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-9094}:8025"
    restart: unless-stopped

  player-service:
    <<: *db-service
    build:
      context: ./backend
      target: runtime
      args:
        MODULE: player-service

  playmatch-service:
    <<: *db-service
    build:
      context: ./backend
      target: runtime
      args:
        MODULE: playmatch-service
    environment:
      <<: *db-env
      # Guest check-in: playmatch-service calls these two services (Compose service names, private network).
      PLAYER_URL: ${PLAYER_URL:-http://player-service:8080}
      AUTH_URL: ${AUTH_URL:-http://auth-service:8080}
      # Checks the identity token from the gateway (Host board); same value as the gateway.
      INTERNAL_TOKEN_SECRET: ${INTERNAL_TOKEN_SECRET:?Set INTERNAL_TOKEN_SECRET in .env (at least 32 characters, see .env.example)}
      # Optional remote debugging (IntelliJ "Remote JVM Debug" -> localhost:9092; container-side port stays 5005). Empty = off.
      JAVA_TOOL_OPTIONS: ${BACKEND_DEBUG_OPTS:-}
    ports:
      - "127.0.0.1:${BACKEND_DEBUG_PORT:-9092}:5005"

  frontend:
    build:
      context: ./frontend
    environment:
      # Inside the container, "localhost" is the frontend itself; reach the gateway by service name.
      API_PROXY_TARGET: http://gateway:8080
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-9091}:5173"
    volumes:
      # Source is bind-mounted for hot reload; node_modules stays inside the container
      # (Linux native packages differ from macOS ones).
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Backend tests (all modules) against the separate faircourt_test database:
  #   docker compose --profile test run --rm --build backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/faircourt_test
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - m2cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy

  # Format backend Java in place (Spotless + Palantir Java Format), all modules:
  #   docker compose run --rm backend-format
  backend-format:
    profiles: ["tools"]
    build:
      context: ./backend
      target: deps
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - m2cache:/root/.m2
    command: ["mvn", "-B", "-q", "spotless:apply"]

volumes:
  pgdata:
  m2cache:
